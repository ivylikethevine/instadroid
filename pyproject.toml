[project]
# Not published anywhere: installing the project (`pip install -e '.[dev]'` in the dev venv) puts app/ on
# the path and adds the developer commands below. The image doesn't install it; it copies app/ instead.
name = "instadroid"
version = "0"
requires-python = ">=3.14"
dynamic = ["dependencies", "optional-dependencies"]

[project.scripts]
new-profile = "devtools.new_profile:main"
promote-dump = "devtools.promote_dump:main"
check-new-builds = "devtools.check_new_builds:main"
export-openapi = "devtools.export_openapi:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "app" }
py-modules = ["scraper"]

[tool.setuptools.packages.find]
where = ["app"]
exclude = ["*.fixtures"]

[tool.setuptools.dynamic]
dependencies = { file = ["app/requirements.txt"] }
optional-dependencies.dev = { file = ["requirements-dev.txt"] }

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["local"]
cache-dir = "local/.ruff_cache"

[tool.ruff.lint]
# ANN: every function is annotated, tests included, and ANN401 forbids an explicit Any. TID251 bans the
# typing escape hatches outright (see banned-api below), PGH forbids blanket `# type: ignore`/`# noqa`, and
# RUF100 flags a `# noqa` that no longer suppresses anything. tests/test_typing_policy.py covers the rest.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ANN", "TID251", "PGH", "RUF100"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "No Any: give the value a real type (see README's Development section)"
"typing_extensions.Any".msg = "No Any: give the value a real type"
"typing.cast".msg = "No cast(): narrow with isinstance or a typed helper instead"
"typing_extensions.cast".msg = "No cast(): narrow with isinstance or a typed helper instead"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
cache_dir = "local/.pytest_cache"

[tool.coverage.run]
data_file = "local/.coverage"
source = ["app"]

[tool.coverage.report]
# The project rule (README, Development): at least 90% of all Python code is covered by tests.
fail_under = 90

[tool.basedpyright]
# basedpyright: pyright's strict mode plus reportAny/reportExplicitAny, so no value typed Any anywhere, not even
# one flowing in from the standard library (sqlite3.Row items, json.loads). Strict everywhere, tests included. The libraries that
# ship no type information (uiautomator2, adbutils, feedgen) get local stubs in typings/.
include = ["app", "tests"]
extraPaths = ["app"]
stubPath = "typings"
pythonVersion = "3.14"
typeCheckingMode = "strict"
# Tests exercise private helpers on purpose, and ruff already reports unused names.
reportPrivateUsage = false
reportUnusedImport = false
reportUnusedVariable = false
reportUnusedFunction = false
reportUnusedClass = false
reportAny = "error"
reportExplicitAny = "error"
reportIgnoreCommentWithoutRule = "error"
enableTypeIgnoreComments = false

[tool.importlinter]
# Boundaries the design depends on; run as `lint-imports` from the repo root in the dev venv, like CI.
root_packages = ["devtools", "feedserver", "igprofiles", "instadroid", "shared"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The feed server runs as its own process and doesn't import the scraper"
type = "forbidden"
source_modules = ["feedserver"]
forbidden_modules = ["instadroid", "igprofiles", "devtools", "uiautomator2", "adbutils"]

[[tool.importlinter.contracts]]
name = "The scraper doesn't import the feed server"
type = "forbidden"
source_modules = ["instadroid", "igprofiles"]
forbidden_modules = ["feedserver", "devtools"]

[[tool.importlinter.contracts]]
name = "shared is the leaf both processes import, and imports neither"
type = "forbidden"
source_modules = ["shared"]
forbidden_modules = ["feedserver", "instadroid", "igprofiles", "devtools"]

[[tool.importlinter.contracts]]
name = "Version profiles don't depend on the scraper code they configure"
type = "forbidden"
source_modules = ["igprofiles"]
forbidden_modules = ["instadroid"]

[[tool.importlinter.contracts]]
name = "Parsing stays pure: no device, network or database code (what the replay tests rely on)"
type = "forbidden"
source_modules = ["instadroid.parsing"]
forbidden_modules = [
    "uiautomator2",
    "adbutils",
    "instadroid.device",
    "instadroid.navigation",
    "instadroid.capture",
    "instadroid.stories",
    "instadroid.scrape",
    "instadroid.install",
    "instadroid.db",
]

[tool.typos]
# crate-ci/typos, over everything git tracks. A deliberate misspelling on one line takes a trailing
# `spellchecker: disable-line` comment rather than a project-wide allowance.
default.extend-ignore-re = ["(?Rm)^.*(#|//)\\s*spellchecker:\\s*disable-line$"]

[tool.typos.default.extend-words]
unparseable = "unparseable" # a common spelling, not a typo
unexpectly = "unexpectly"   # uiautomator2's own error text ("server quit unexpectly"), matched verbatim
