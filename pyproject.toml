[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["local"]
cache-dir = "local/.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["app"]
cache_dir = "local/.pytest_cache"

[tool.coverage.run]
data_file = "local/.coverage"
omit = ["app/tests/*"]

[tool.pyright]
include = ["app", "scripts"]
# Tests run under pytest instead; their assertions on Optional values would need narrowing noise.
exclude = ["app/tests"]
extraPaths = ["app"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
