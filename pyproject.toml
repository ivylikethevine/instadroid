[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["local"]
cache-dir = "local/.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
cache_dir = "local/.pytest_cache"

[tool.coverage.run]
data_file = "local/.coverage"
omit = ["app/tests/*"]
