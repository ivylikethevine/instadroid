# Services, in start order:
#   init      one-shot, as root: the /data version guard and the app's data directories
#             (scripts/init-data.sh; `docker compose run --no-deps` skips it)
#   redroid   the Android device (privileged); ADB on 127.0.0.1:5555
#   app       the scraper and the feed server, two processes in one container (app/entrypoint.sh)
#   freshrss  optional reader, only with `--profile freshrss` (docs/FRESHRSS.md)
#
# Settings all come from .env, in two kinds (.env.example documents both):
#   - read by the app itself (credentials, POLL_*, MAX_SCROLLS, ...): passed through `env_file`,
#     defaults in app/instadroid/config.py;
#   - read by compose to size containers and the device: the ${NAME:-default} values below.
# Everything the app writes lives under local/data/.
#
# Why the limits are what they are: CLAUDE.md ("Memory") and docs/INCIDENTS.md. Why this redroid
# image: README.md ("Which Android?") and docs/COMPATIBILITY.md.

x-redroid-image: &redroid_image erstt/redroid:13.0.0_ndk_ChromeOS

# init and app run the same locally built image, so it's built once.
x-app-image: &app_image
  build: ./app
  image: instadroid-app

x-logging: &logging # json-file, capped at 3 x 10MB per container
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  init:
    <<: *app_image
    user: "0:0"
    restart: "no"
    logging: *logging
    entrypoint: ["sh", "/scripts/init-data.sh", *redroid_image]
    volumes:
      - ./scripts:/scripts:ro
      - ./local/data:/data

  redroid:
    image: *redroid_image
    container_name: ig-redroid
    privileged: true
    restart: unless-stopped # back after a host reboot; `docker compose stop`/`down` keeps it down
    logging: *logging
    depends_on:
      init:
        condition: service_completed_successfully
    # No swap (memswap_limit = mem_limit): a container thrashing swap stalls the whole host. Don't lower
    # the memory limit without remeasuring. shm_size is deliberately generous (screenshot buffers).
    mem_limit: ${REDROID_MEM_LIMIT:-3g}
    memswap_limit: ${REDROID_MEM_LIMIT:-3g}
    shm_size: 1g
    cpus: ${REDROID_CPUS:-4}
    ports:
      - "127.0.0.1:5555:5555" # ADB, for the app, scrcpy and manual adb from the host
    volumes:
      - ./local/data/android:/data # never share with a different Android major version (init checks)
    command:
      - androidboot.redroid_gpu_mode=guest # =host was tried and rejected (CLAUDE.md)
      # Screen size: the ceiling on crop sharpness, at the cost of boot time and memory.
      - androidboot.redroid_width=${REDROID_WIDTH:-1080}
      - androidboot.redroid_height=${REDROID_HEIGHT:-2340}
      - androidboot.redroid_dpi=${REDROID_DPI:-420}
      - androidboot.redroid_fps=30
      - androidboot.use_memfd=true

  app:
    <<: *app_image
    container_name: ig-app
    restart: unless-stopped # entrypoint.sh exits if either process dies, so this restarts both
    logging: *logging
    depends_on:
      redroid:
        condition: service_started
    network_mode: host # reaches redroid's ADB on 127.0.0.1:5555; the feed binds 127.0.0.1:8000
    env_file: .env
    environment:
      REDROID_IMAGE: *redroid_image # recorded with each run, shown on /status
    # The app's defaults for DB_PATH, MEDIA_DIR, DEBUG_DIR and APK_CACHE_DIR are these mounts.
    volumes:
      - ./local/data/db:/db
      - ./local/data/media:/media
      - ./local/data/debug:/debug
      - ./local/data/apk:/apk
    # Peak ~125MiB while scraping. No swap, same reason as redroid.
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.5
    # Healthcheck: the image's own (app/Dockerfile), probing /health. Docker only marks the container
    # unhealthy; it doesn't restart it.
    # Optional Docker secret instead of IG_PASSWORD in .env: create the file (readable by uid 1000),
    # uncomment this and the top-level `secrets:` at the end, and set
    # IG_PASSWORD_FILE=/run/secrets/ig_password in .env.
    # secrets: [ig_password]

  freshrss:
    image: freshrss/freshrss:1.30.0-alpine
    container_name: ig-freshrss
    profiles: [freshrss]
    restart: unless-stopped
    logging: *logging
    # Host networking, like app: FreshRSS fetches the feed on 127.0.0.1:8000, and the scraper pings it
    # back on loopback. LISTEN keeps FreshRSS itself off the LAN.
    network_mode: host
    environment:
      LISTEN: ${FRESHRSS_LISTEN:-127.0.0.1:8080}
      TZ: ${DEVICE_TIMEZONE:-UTC}
      CRON_MIN: ${FRESHRSS_CRON_MIN:-} # empty: the scraper pings FreshRSS instead of it polling
      # Required: FreshRSS 1.30+ refuses to fetch internal hosts (an SSRF guard), so without this the
      # subscription to 127.0.0.1 silently fetches nothing.
      INTERNAL_HOST_ALLOWLIST: ${FRESHRSS_INTERNAL_HOST_ALLOWLIST:-127.0.0.1:8000 localhost:8000}
    volumes:
      - ./local/data/freshrss/data:/var/www/FreshRSS/data
      - ./local/data/freshrss/extensions:/var/www/FreshRSS/extensions
    mem_limit: 512m

# Goes with the app service's commented `secrets:` above.
# secrets:
#   ig_password:
#     file: ./local/secrets/ig_password
