services:
  # Optional: containerised Android, validated working 2026-09-10 (Instagram install/login/scrape
  # all succeeded). This image is Android 13 + Google's NDK translation as shipped in ChromeOS's
  # ARC++ — the earlier Android-11 libndk image crashed Instagram at native startup. See CLAUDE.md
  # for the careful start/monitor procedure before running this, especially with a different image.
  # Start with: docker compose --profile redroid up -d
  redroid:
    image: erstt/redroid:13.0.0_ndk_ChromeOS
    container_name: ig-redroid
    profiles: [redroid]
    privileged: true
    restart: "no"
    volumes:
      - ./data/android:/data
    ports:
      - "127.0.0.1:5555:5555"   # ADB, for scrcpy / manual login from the host
    command:
      - androidboot.redroid_gpu_mode=guest
      - androidboot.redroid_width=1080
      - androidboot.redroid_height=2340
      - androidboot.redroid_dpi=420
      - androidboot.redroid_fps=30

  driver:
    build: ./driver
    container_name: ig-driver
    restart: "no"
    network_mode: host         # so it can reach the emulator's ADB port on the host loopback
    env_file: .env             # IG_USERNAME / IG_PASSWORD for automated login
    environment:
      ADB_ADDR: ${ADB_ADDR:-127.0.0.1:5557}   # run-emulator.sh pins emulator-5556 -> adb port 5557; redroid: 127.0.0.1:5555
      DB_PATH: /db/posts.sqlite
      MEDIA_DIR: /media
      DEBUG_DIR: /debug
      POLL_MIN_HOURS: "2.5"
      POLL_MAX_HOURS: "4.5"
      MAX_SCROLLS: "25"
      STOP_AFTER_SEEN: "4"        # stop after N consecutive already-seen posts
      RETAIN_DAYS: "60"           # delete posts (and their media) older than this; 0 keeps forever
    volumes:
      - ./data/db:/db
      - ./data/media:/media
      - ./data/debug:/debug
    mem_limit: 512m
    cpus: 1.0

  feed:
    build: ./feed
    container_name: ig-feed
    restart: "no"
    depends_on: [driver]   # so the posts table exists before feed's first request, not just the DB file
    environment:
      DB_PATH: /db/posts.sqlite
      MEDIA_DIR: /media
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}   # what FreshRSS can reach
    volumes:
      - ./data/db:/db:ro
      - ./data/media:/media:ro
    ports:
      - "127.0.0.1:8000:8000"   # loopback only; override if FreshRSS needs LAN access
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
