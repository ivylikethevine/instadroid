# One definition shared by the redroid service and the app's REDROID_IMAGE (recorded per run, shown
# on /status), so the two can't drift apart.
x-redroid-image: &redroid_image erstt/redroid:13.0.0_ndk_ChromeOS

# Cap each container's json-file log at 3 x 10MB; unbounded by default.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # The Android side: a containerised device via redroid. Android 13 + ChromeOS's ARC++ NDK
  # translation is validated working as of 2026-09-10 (Instagram install/login/scrape all
  # succeeded) — the earlier Android-11 libndk image crashed Instagram at native startup.
  # erstt/redroid:15.0.0_ndk_AVD crashed harder: hwservicemanager/servicemanager both fatal within
  # ~3s of boot, twice, unchanged by generous mem_limit/shm_size (below) — a binder ABI mismatch
  # with this host (host-safe both times). aureliolo/redroid:14.0.0_amd64_with_gapps boots fine but
  # ships no ARM translation at all: Instagram's arm64 .so crashes the dynamic linker outright
  # (EM_AARCH64 vs EM_X86_64, host-safe). erstt/redroid is the only source found with confirmed ARM
  # translation, and it doesn't publish Android 14. See CLAUDE.md for the careful start/monitor
  # procedure and README.md's "Which Android?" for the full compatibility history.
  redroid:
    image: *redroid_image
    container_name: ig-redroid
    logging: *logging
    privileged: true
    # Comes back after a host reboot or crash; `docker compose stop`/`down` keeps it down.
    restart: unless-stopped
    # Memory: a live scrape measured 1.98GiB (2026-09-11), and on 2026-09-14 a scrape sat at
    # 1.7-1.99GiB of the old 2g for its whole run, the kernel OOM-killed 7 Android processes inside
    # the container, and the host desktop froze until the run was stopped (see CLAUDE.md). 3g gives
    # real headroom over that peak. memswap_limit equal to mem_limit means no swap: a container
    # thrashing swap is exactly the kind of pressure that stalls the whole host. The scraper also
    # stops a run itself before this ceiling (MEMORY_GUARD_PERCENT in app/scraper.py).
    # shm_size stays generous: under-provisioning it risks screenshot/graphics-buffer failures that
    # are much harder to diagnose than an OOM.
    mem_limit: ${REDROID_MEM_LIMIT:-3g}
    memswap_limit: ${REDROID_MEM_LIMIT:-3g}
    shm_size: 1g
    # CPU: ARM translation, JIT and dex2oat can saturate every core; a cap keeps the host usable.
    # 4 is half of this host's 8 cores.
    cpus: ${REDROID_CPUS:-4}
    volumes:
      - ./local/data/android:/data
    ports:
      - "127.0.0.1:5555:5555"   # ADB, for scrcpy / manual login from the host
    command:
      - androidboot.redroid_gpu_mode=guest
      # Raising these makes screenshotted post crops sharper (screen resolution is the ceiling on
      # crop quality — see MEDIA_QUALITY below), at the cost of slower boot/more memory.
      - androidboot.redroid_width=${REDROID_WIDTH:-1080}
      - androidboot.redroid_height=${REDROID_HEIGHT:-2340}
      - androidboot.redroid_dpi=${REDROID_DPI:-420}
      - androidboot.redroid_fps=30
      - androidboot.use_memfd=true

  # One-shot: creates the app's bind-mount directories owned by the app user (uid 1000) before app
  # starts. Without it, Docker creates a missing bind-mount source as root, and the app (USER 1000)
  # then fails with "sqlite3.OperationalError: unable to open database file". Only a directory still
  # owned by root is chowned, and never recursively. local/data/android is left alone: redroid runs
  # as root and Android manages its own permissions inside it. Same image as app, so there's nothing
  # extra to pull. Note `docker compose run --no-deps app` skips this.
  init-dirs:
    build: ./app
    user: "0:0"
    restart: "no"
    logging: *logging
    entrypoint: ["sh", "-c"]
    command:
      - >-
        for d in db media debug apk; do
        mkdir -p "/data/$$d";
        [ "$$(stat -c %u "/data/$$d")" = 0 ] && chown 1000:1000 "/data/$$d";
        done; true
    volumes:
      - ./local/data:/data

  # Single image: the scraper loop and the feed server run as two processes in one container
  # (see app/entrypoint.sh), so this is the only thing to build/publish alongside redroid.
  app:
    build: ./app
    container_name: ig-app
    # entrypoint.sh exits if either process dies, so this restarts a clean scraper+feed pair.
    restart: unless-stopped
    logging: *logging
    depends_on:
      redroid:
        condition: service_started
      init-dirs:
        condition: service_completed_successfully
    network_mode: host         # so it can reach redroid's ADB port on the host loopback
    env_file: .env             # IG_USERNAME / IG_PASSWORD for automated login
    environment:
      ADB_ADDR: ${ADB_ADDR:-127.0.0.1:5555}   # redroid's forwarded ADB port
      DB_PATH: /db/posts.sqlite
      MEDIA_DIR: /media
      DEBUG_DIR: /debug
      POLL_MIN_HOURS: ${POLL_MIN_HOURS:-2.5}
      POLL_MAX_HOURS: ${POLL_MAX_HOURS:-4.5}
      MAX_SCROLLS: ${MAX_SCROLLS:-25}
      STOP_AFTER_SEEN: ${STOP_AFTER_SEEN:-4}   # stop after N consecutive already-seen posts
      RETAIN_DAYS: ${RETAIN_DAYS:-60}          # delete posts (and their media) older than this; 0 keeps forever
      SCROLL_SWIPE_MIN: ${SCROLL_SWIPE_MIN:-0.6}   # seconds the swipe gesture itself takes
      SCROLL_SWIPE_MAX: ${SCROLL_SWIPE_MAX:-1.0}
      SCROLL_PAUSE_MIN: ${SCROLL_PAUSE_MIN:-1.5}   # seconds idle between scrolls
      SCROLL_PAUSE_MAX: ${SCROLL_PAUSE_MAX:-4.0}
      MEDIA_QUALITY: ${MEDIA_QUALITY:-95}          # encoder quality (1-95) for saved images
      MEDIA_FORMAT: ${MEDIA_FORMAT:-webp}          # webp | jpeg; already-saved files keep their format
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}   # what FreshRSS can reach
      FEED_HOST: ${FEED_HOST:-127.0.0.1}   # loopback only by default; set to 0.0.0.0 for LAN access
      PERMALINK_RETRIES: ${PERMALINK_RETRIES:-2}   # extra share-sheet passes after the first
      SHARE_TAP_TRIES: ${SHARE_TAP_TRIES:-2}       # taps on the share button before giving up
      CLIPBOARD_TIMEOUT: ${CLIPBOARD_TIMEOUT:-6.0} # seconds to poll the clipboard for
      MAX_CAROUSEL_SLIDES: ${MAX_CAROUSEL_SLIDES:-10}
      VIDEO_SETTLE_SECONDS: ${VIDEO_SETTLE_SECONDS:-1.5}   # let autoplay/overlay settle before the still
      AVATAR_REFRESH_DAYS: ${AVATAR_REFRESH_DAYS:-14}
      MEDIA_MAX_MB: ${MEDIA_MAX_MB:-0}              # total media+DB size cap in MB; 0 disables
      MAX_STORIES_PER_RUN: ${MAX_STORIES_PER_RUN:-10}
      STORY_RETAIN_HOURS: ${STORY_RETAIN_HOURS:-24}  # matches Instagram's own story expiry
      TIME_DISTRIBUTION: ${TIME_DISTRIBUTION:-uniform}   # uniform | lognormal | daynight
      DEVICE_TIMEZONE: ${DEVICE_TIMEZONE:-}   # empty = leave the device's clock alone; also read by tune-android.sh
      DAYNIGHT_QUIET_START: ${DAYNIGHT_QUIET_START:-0}
      DAYNIGHT_QUIET_END: ${DAYNIGHT_QUIET_END:-6}
      EMPTY_SCREEN_LIMIT: ${EMPTY_SCREEN_LIMIT:-3}         # empty screens in a row before reopening/stopping; 0 disables
      RETRY_DELAYS_MINUTES: ${RETRY_DELAYS_MINUTES-2,5,15} # early retries after a transient device failure; empty disables
      DEBUG_RETAIN_DAYS: ${DEBUG_RETAIN_DAYS:-7}   # delete debug .xml/.jpg/.png/.txt older than this; 0 disables
      LOGCAT_TAIL_LINES: ${LOGCAT_TAIL_LINES:-2000}  # lines kept in the filtered logcat saved after a device failure
      SCRAPE_ON_STARTUP: ${SCRAPE_ON_STARTUP:-0}   # 1 = scrape immediately on start instead of waiting out the poll interval
      REDROID_IMAGE: *redroid_image                # recorded with each run
      IG_AUTO_INSTALL: ${IG_AUTO_INSTALL:-1}       # fetch+install Instagram via apkeep if missing on the device
      IG_PROFILE: ${IG_PROFILE:-}                  # Instagram version profile dir in app/igprofiles/ (e.g. v446); empty = the default (v445)
      IG_APK_VERSION: ${IG_APK_VERSION:-}          # override the build to install; empty = the profile's own; "latest" = newest on APKPure
      APK_CACHE_DIR: ${APK_CACHE_DIR:-/apk}         # cached xapk/apk, reused across installs
      APK_FETCH_TIMEOUT: ${APK_FETCH_TIMEOUT:-300}  # seconds allowed for apkeep's download / adb install
      MEMORY_GUARD_PERCENT: ${MEMORY_GUARD_PERCENT:-85}  # stop a run once redroid uses this % of its mem_limit; 0 disables
    volumes:
      - ./local/data/db:/db
      - ./local/data/media:/media
      - ./local/data/debug:/debug
      - ./local/data/apk:/apk
    # Measured peak while actively scraping: ~97-125MiB (idle is ~67-97MiB). No swap, same reason
    # as redroid above.
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.5
    # /health returns 503 once scraping looks stuck or keeps failing (see _scraper_health() in
    # app.py), so `docker ps` shows "unhealthy". Docker itself doesn't restart unhealthy containers.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: a real FreshRSS to subscribe to this instance's feeds. Off by default — start with
  # `docker compose --profile freshrss up -d freshrss`. First-run setup (creates the SQLite-backed
  # instance and a user with an API token) is two one-time commands, see README's FreshRSS section:
  #   docker compose exec freshrss ./cli/do-install.php --default_user <name> --auth_type form --db-type sqlite
  #   docker compose exec freshrss ./cli/create-user.php --user <name> --password <pw> --token <token> --no-default-feeds
  # That token is what FRESHRSS_REFRESH_URL (app service env, read by scraper.py) is built from.
  freshrss:
    image: freshrss/freshrss:1.30.0-alpine
    container_name: ig-freshrss
    profiles: [freshrss]
    logging: *logging
    restart: unless-stopped
    # Host networking, same reason as the app service above: the feed server binds the host's own
    # 127.0.0.1:8000 (FEED_HOST default), which a bridged container could not reach, and the
    # scraper's refresh ping has to reach FreshRSS back over that same loopback. LISTEN below keeps
    # FreshRSS itself loopback-only despite host networking, since the feed still has no auth of its
    # own (see README's "Optional feed auth" roadmap item) — nothing here should reach the LAN.
    network_mode: host
    environment:
      LISTEN: ${FRESHRSS_LISTEN:-127.0.0.1:8080}
      TZ: ${DEVICE_TIMEZONE:-UTC}
      CRON_MIN: ${FRESHRSS_CRON_MIN:-}   # empty: the scraper pushes instead of FreshRSS polling
      # Required, not optional: FreshRSS 1.30+ refuses to fetch "internal" hosts as an SSRF guard,
      # and this feed lives on 127.0.0.1 — without this the subscription silently fetches nothing.
      INTERNAL_HOST_ALLOWLIST: ${FRESHRSS_INTERNAL_HOST_ALLOWLIST:-127.0.0.1:8000 localhost:8000}
    volumes:
      - ./local/data/freshrss/data:/var/www/FreshRSS/data
      - ./local/data/freshrss/extensions:/var/www/FreshRSS/extensions
    mem_limit: 512m
