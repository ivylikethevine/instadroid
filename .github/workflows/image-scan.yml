name: Image scan

# Two advisory trivy scans; neither blocks anything (publish.yml's scan job is the release gate).
# - pins: the digest-pinned images this repo builds on (app/Dockerfile's python base, docker-compose.yml's
#   redroid and freshrss). Dependabot repins on release, not on severity, so this scans each pinned digest
#   and what its tag points at now, and keeps one tracking issue open only while a repin verifiably closes
#   fixable HIGH/CRITICAL findings (state machine: .github/scripts/scan_pinned_images.sh's header).
# - trivy: the published ghcr.io image's :latest, which goes stale between releases as advisories land;
#   findings go to code scanning and a warning.
# Runs after every green CI run on a push to main and weekly, since upstream rebuilds and new advisories land
# with no push here; never per pull request. workflow_run is safe: the jobs run only after a green push to
# main.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "37 6 * * 3"
  workflow_dispatch: {}

permissions:
  contents: read

# Queue rather than cancel: a run cancelled mid-upsert can leave the tracking issue half-written or open a
# duplicate.
concurrency:
  group: image-scan
  cancel-in-progress: false

jobs:
  trivy:
    name: published image (trivy, advisory)
    # Only a green push to main; the schedule and a manual dispatch pass the first clause.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # setup-tool, advisory-note and .trivyignore
      packages: read # pull the published image
      security-events: write # upload the SARIF to code scanning
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Before the first release (or on a fork) there is no :latest: a notice, not a failure.
      - id: probe
        name: Check that a release image exists
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}:latest"
          echo "image=$image" >>"$GITHUB_OUTPUT"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "exists=1" >>"$GITHUB_OUTPUT"
          else
            echo "exists=0" >>"$GITHUB_OUTPUT"
            echo "::notice title=image-scan::$image hasn't been published yet; nothing to scan"
          fi

      - if: steps.probe.outputs.exists == '1'
        uses: $/.github/actions/setup-tool
        with:
          tool: trivy

      # The release gate's flags, so this answers "would :latest still pass publish.yml's scan today". One
      # JSON scan, converted to the table and the SARIF. trivy exits 1 on a finding and on a failed scan
      # alike; only a scan that ran writes the report.
      - if: steps.probe.outputs.exists == '1'
        id: scan
        name: Scan for fixable HIGH/CRITICAL vulnerabilities
        env:
          IMAGE: ${{ steps.probe.outputs.image }}
        run: |
          set -uo pipefail
          rc=0
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile .trivyignore --no-progress \
            --format json --output "$RUNNER_TEMP/trivy.json" "$IMAGE" || rc=$?
          if ! jq -e .SchemaVersion "$RUNNER_TEMP/trivy.json" >/dev/null 2>&1; then
            echo "::error title=trivy::the scan of $IMAGE did not run (exit $rc)"
            exit 1
          fi
          set -e
          trivy convert --format table --table-mode detailed --output "$RUNNER_TEMP/trivy.txt" "$RUNNER_TEMP/trivy.json"
          trivy convert --format sarif --output "$RUNNER_TEMP/trivy.sarif" "$RUNNER_TEMP/trivy.json"
          cat "$RUNNER_TEMP/trivy.txt"
          echo "found=$rc" >>"$GITHUB_OUTPUT"

      - if: steps.probe.outputs.exists == '1'
        name: Upload the findings to code scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          category: image-scan-latest

      - if: steps.probe.outputs.exists == '1' && steps.scan.outputs.found != '0'
        uses: $/.github/actions/advisory-note
        with:
          title: trivy
          warning-body: Fixable HIGH/CRITICAL vulnerabilities in ${{ steps.probe.outputs.image }} - advisory, not blocking
          heading: Trivy found fixable HIGH/CRITICAL vulnerabilities in the published image
          body: >-
            In `${{ steps.probe.outputs.image }}`, also in the Security tab under `image-scan-latest`. The
            next release rebuilds the image with current Debian and Python packages; this job never blocks.
          report-file: ${{ runner.temp }}/trivy.txt

      - if: steps.probe.outputs.exists == '1' && steps.scan.outputs.found == '0'
        name: Report a clean scan
        env:
          IMAGE: ${{ steps.probe.outputs.image }}
        run: echo "trivy - no fixable HIGH/CRITICAL vulnerabilities in $IMAGE" | tee -a "$GITHUB_STEP_SUMMARY"

  pins:
    name: pinned images (trivy, advisory)
    # Only a green push to main; the schedule and a manual dispatch pass the first clause.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write # open, refresh or close the tracking issue
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-tool
        with:
          tool: trivy

      # Advisory: an upstream CVE is no reason to fail anything. The three verdicts (0 clean, 1 a finding
      # no repin improves, 2 a repin that helps) are captured as an output; anything else (3: the vulnerability
      # database download failed; 127: no trivy or jq) still fails the job.
      - id: scan
        name: Scan pinned digests and their tags
        env:
          SCAN_REPORT: ${{ runner.temp }}/image-scan-report.md
        run: |
          set -uo pipefail
          rc=0
          .github/scripts/scan_pinned_images.sh || rc=$?
          echo "verdict=$rc" >>"$GITHUB_OUTPUT"
          [ "$rc" -le 2 ] || exit "$rc"

      # An issue, not a pull request: Dependabot already opens the repin PR. The report is the summary and
      # the issue body both, so the two can't disagree.
      - uses: $/.github/actions/upsert-tracking-issue
        with:
          label: image-scan
          label-color: D93F0B
          label-description: A pinned image can be repinned to fix a CVE
          title: Image repin would close known vulnerabilities
          resolved: ${{ steps.scan.outputs.verdict != '2' }}
          close-comment: The pins no longer have a fixable finding a repin would clear.
          resolved-when: the pins no longer need it
          write-summary-on-resolved: "true"
          body-file: ${{ runner.temp }}/image-scan-report.md
          warning-title: trivy
          warning-body: A pinned image can be repinned to close known vulnerabilities - see the image-scan issue
