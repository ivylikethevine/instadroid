name: Coverage

# The test suite's coverage, as data: the `coverage-badge` artifact holds the README's two shields.io
# endpoint files, coverage.json (the total, bright green from pyproject.toml's fail_under) and tests.json
# (tests passed), written by .github/scripts/coverage_badges.sh. pages.yml fetches the newest one from main
# and serves it as badges/*.json, so no coverage service, token or badge branch is involved. The gate
# itself is ci.yml's test job.
#
# After every green CI run on a push to main (workflow_run), and on dispatch. A green push hands on the
# figures ci.yml's test job measured, in that run or, when the push reused a same-repository pull request's
# run of the same tree, in that one; only when neither has them is the suite run here, as on a dispatch.
# workflow_run is safe here: the job runs only for a green push to main or a dispatch, checks out the
# default branch rather than anything from the triggering run, and holds nothing but read tokens.
#
# After CI on a same-repo pull request into main too, for the `comment` job: the figures that run's
# test job measured beside main's latest, in one comment edited in place on every push. Nothing is
# measured here for a pull request. Never a fork's: its token can't comment, and its run must never be a
# candidate for main's figures (only the `coverage` job uploads, and fetch-latest-artifact also scopes
# pages.yml's lookup to workflow_run runs on main). No branch filter on the trigger: a pull request run's
# head_branch is its source branch, so each job's `if` scopes it instead.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# A newer CI run of a pull request replaces its in-flight comment; main's runs queue, since pages.yml
# deploys from each one.
concurrency:
  group: >-
    coverage-${{ github.event.workflow_run.event == 'pull_request' &&
    format('pr-{0}-{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) ||
    'main' }}
  cancel-in-progress: ${{ github.event.workflow_run.event == 'pull_request' }}

jobs:
  coverage:
    name: coverage (pytest)
    # a dispatch, or a green push to main
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the figures CI measured, from another workflow run
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # continue-on-error: a failed lookup measures here, never a missing badge
      - id: measured
        name: Find the run that measured this commit
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          TREE: ${{ github.event.workflow_run.head_commit.tree_id }}
        run: |
          set -euo pipefail
          have="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/artifacts?per_page=100" --jq '.artifacts[].name')"
          if grep -qxF coverage-badge <<<"$have"; then
            echo "run=$RUN" | tee -a "$GITHUB_OUTPUT"
          else
            .github/scripts/find_tree_run.sh ci.yml "ci-tree-$TREE" coverage-badge | tee -a "$GITHUB_OUTPUT"
          fi
      - if: steps.measured.outputs.run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-badge
          path: coverage-badge
          run-id: ${{ steps.measured.outputs.run }}
          github-token: ${{ github.token }}
      - if: steps.measured.outputs.run != ''
        continue-on-error: true # only the report for reading a gap; the badge is what pages.yml needs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-html
          path: coverage-html
          run-id: ${{ steps.measured.outputs.run }}
          github-token: ${{ github.token }}
      - if: steps.measured.outputs.run == ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - if: steps.measured.outputs.run == ''
        run: pip install --require-hashes -r app/requirements.txt -r requirements-dev.txt && pip install --no-build-isolation --no-deps -e .
      - if: steps.measured.outputs.run == ''
        uses: ./.github/actions/measure-coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('coverage-badge/coverage.json') != '' }}
        with:
          name: coverage-badge
          path: coverage-badge
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && hashFiles('coverage-html/index.html') != '' }}
        with:
          name: coverage-html
          path: coverage-html
          retention-days: 90

  # The PR's figures beside main's newest, as one comment edited in place. Nothing here runs the PR's
  # code; the checkout is only for the local fetch-latest-artifact action. continue-on-error: a comment
  # that can't be posted (a read-only token, e.g. Dependabot's) never fails the run. A failed CI run still
  # has figures (measure-coverage writes them whatever the suite did); a cancelled one was superseded.
  comment:
    name: coverage (comment)
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure') &&
      contains(github.event.workflow_run.pull_requests.*.base.ref, 'main')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read # main's artifact, from another workflow run
      pull-requests: write # post or edit the comment
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # none when CI's test job skipped (a draft, or only Markdown, docs/ or workflow files changed):
      # neither figure can have moved, so the comment stays as it is
      - id: figures
        name: Download the CI run's figures
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-badge
          path: ${{ runner.temp }}/pr
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - if: steps.figures.outcome != 'success'
        run: echo "CI's test job didn't run on this commit - nothing new to comment." | tee -a "$GITHUB_STEP_SUMMARY"
      # main's runs of this workflow are workflow_run-triggered, hence `event`
      - name: Fetch main's figures
        if: steps.figures.outcome == 'success'
        uses: ./.github/actions/fetch-latest-artifact
        with:
          workflow: coverage.yml
          artifact-name: coverage-badge
          dest-subdir: main
          event: workflow_run
          found-message: main's figures from coverage run
          missing-message: no successful coverage run on main - nothing to compare with
      # via env, never inline ${{ }} in the run block (zizmor: template-injection)
      - name: Post or update the comment
        if: steps.figures.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          # the CI run's pull request into main; a number, so safe to interpolate below
          PR="$(jq -r '[.workflow_run.pull_requests[] | select(.base.ref == "main") | .number][0] // ""' "$GITHUB_EVENT_PATH")"
          [[ "$PR" =~ ^[0-9]+$ ]] || {
            echo "::warning title=coverage comment::no pull request into main on CI run $RUN_URL"
            exit 0
          }
          marker='<!-- coverage-comment -->'
          # fig <dir> <file> - the number in a badge's message, or nothing: an artifact is data, and
          # nothing but digits read from one reaches the comment
          fig() {
            local v=""
            [ -f "$1/$2" ] && v="$(jq -r '.message // ""' "$1/$2" 2>/dev/null || true)"
            v="${v%%[!0-9]*}"
            printf '%s' "$v"
          }
          # row <label> <unit> <this PR> <main>
          row() {
            local now="not measured" was="not measured" change="-"
            [ -z "$3" ] || now="$3$2"
            [ -z "$4" ] || was="$4$2"
            [ -z "$3" ] || [ -z "$4" ] || change="$(printf '%+d' "$(($3 - $4))")"
            printf '| %s | %s | %s | %s |\n' "$1" "$now" "$was" "$change"
          }
          pr="$RUNNER_TEMP/pr" main="$RUNNER_TEMP/main"
          body="$(
            printf '%s\n### Coverage\n\n| | This PR | main | Change |\n| --- | ---: | ---: | ---: |\n' "$marker"
            row coverage % "$(fig "$pr" coverage.json)" "$(fig "$main" coverage.json)"
            row "tests passed" "" "$(fig "$pr" tests.json)" "$(fig "$main" tests.json)"
            printf '\nMeasured at %s by [this CI run](%s). %s\n' \
              "$HEAD_SHA" "$RUN_URL" \
              "The floor is \`fail_under\` in \`pyproject.toml\`; ci.yml enforces it."
          )"
          printf '%s\n' "$body" >>"$GITHUB_STEP_SUMMARY"
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)"
          if [ -n "$id" ]; then
            set -- -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id"
          else
            set -- "repos/$GITHUB_REPOSITORY/issues/$PR/comments"
          fi
          gh api "$@" -f body="$body" >/dev/null || {
            echo "::warning title=coverage comment::could not comment on PR #$PR - a read-only token? The table is in this job's summary."
            exit 0
          }
          echo "coverage comment updated on PR #$PR"
