name: New Instagram builds

# Weekly and on dispatch: list the Instagram builds APKPure serves and, while a major version newer than
# every validated build is listed, keep one issue saying which builds need a baseline on a device; the run
# that finds nothing newer closes it. Nothing is downloaded but apkeep's version listing: no APK, account,
# session or dump touches this workflow.
on:
  schedule:
    - cron: "37 8 * * 1" # weekly
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: new-builds
  cancel-in-progress: false

jobs:
  check:
    name: check APKPure for new builds (apkeep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # open, refresh or close the tracking issue
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # The pinned release and checksum read from app/Dockerfile's ADD, so bumping it there carries over.
      - name: Install apkeep
        run: |
          url=$(grep -oE 'https://github\.com/EFForg/apkeep/releases/download/[^ ]+' app/Dockerfile || true)
          sha=$(grep -oE -- '--checksum=sha256:[0-9a-f]{64}' app/Dockerfile | cut -d: -f2 || true)
          if [ -z "$url" ] || [ -z "$sha" ]; then
            echo "couldn't read apkeep's URL and checksum from app/Dockerfile" >&2
            exit 1
          fi
          curl -fsSL -o apkeep "$url"
          echo "$sha  apkeep" | sha256sum -c -
          chmod +x apkeep
      - name: List builds
        run: ./apkeep -l -a com.instagram.android -d apk-pure > versions.txt
      # check-new-builds only reads igprofiles, which needs nothing beyond typing_extensions, so the
      # job skips the app's device and server dependencies. setuptools, locked and hashed, builds the
      # project without fetching an unhashed copy (--no-build-isolation).
      - name: Install check-new-builds
        run: |
          ./.github/scripts/pip-install-locked.sh requirements-dev.txt setuptools
          pip install --no-build-isolation --no-deps -e .
          ./.github/scripts/pip-install-locked.sh app/requirements.txt typing-extensions
      # check-new-builds prints nothing when no build is newer than the validated ones.
      - name: Compare with validated builds
        id: compare
        run: |
          check-new-builds --versions-file versions.txt >"$RUNNER_TEMP/new-builds.md"
          if [ -s "$RUNNER_TEMP/new-builds.md" ]; then
            echo "found=1" >>"$GITHUB_OUTPUT"
          else
            echo "found=0" >>"$GITHUB_OUTPUT"
            echo "nothing newer than the validated builds"
          fi
      - uses: ./.github/actions/upsert-tracking-issue
        with:
          label: new-instagram-build
          label-color: FBCA04
          label-description: Instagram builds to validate
          title: New Instagram builds to validate
          resolved: ${{ steps.compare.outputs.found == '0' }}
          close-comment: APKPure lists nothing newer than the newest validated build.
          resolved-when: APKPure lists nothing newer than the newest validated build
          body-file: ${{ runner.temp }}/new-builds.md
