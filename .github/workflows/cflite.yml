name: ClusterFuzzLite

# Continuous fuzzing of the hierarchy parsers (tests/fuzz/, built by .clusterfuzzlite/): a short
# code-change run on each pull request that touches the parsers, their seeds, the locks their build
# installs, the fuzzers or their build, and a longer batch run weekly that grows the corpus. The corpus
# and any crash are stored as this workflow's artifacts (ClusterFuzzLite's github-actions filestore), so
# a pull request's run starts from the batch runs' corpus. A crash fails the job.
#
# ClusterFuzzLite's own actions (google/clusterfuzzlite/actions/*) are thin wrappers that only carry
# a `v1` tag and run their images by the mutable `:v1` tag, so this calls those images directly,
# pinned by digest; the env below is what the actions would map their inputs to. ClusterFuzzLite
# clones the repository itself, so there's no checkout step.
on:
  # Drafts fuzz nothing (the job's `if`); ready_for_review isn't a default type, and converted_to_draft
  # starts a run that cancels the draft's in-flight one.
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    paths:
      # parsing.py and what it imports from this repository
      - "app/instadroid/parsing.py"
      - "app/instadroid/common.py"
      - "app/instadroid/config.py"
      - "app/instadroid/versioning.py"
      - "app/igprofiles/**"
      - "app/requirements.txt"
      - "tests/fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/cflite.yml"
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cflite-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: Fuzz (${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }})
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # the latest corpus, from earlier runs' artifacts
    env:
      LANGUAGE: python
      SANITIZER: address
      CFL_PLATFORM: github
      LOW_DISK_SPACE: "True"
    steps:
      # audit: the build pulls OSS-Fuzz's images, the pinned Python and the locked packages
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Build fuzzers
        uses: docker://gcr.io/oss-fuzz-base/clusterfuzzlite-build-fuzzers@sha256:5db10ef3679519ca4f0ab9db5d17a2462327b042213ee120ecc1e98fac42486c # v1
        env:
          BAD_BUILD_CHECK: "true"
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run fuzzers
        uses: docker://gcr.io/oss-fuzz-base/clusterfuzzlite-run-fuzzers@sha256:163155a2e32aa262507fa1c2c88d8d0be41fef3cad8b0d2bebffa31237e39a88 # v1
        env:
          MODE: ${{ github.event_name == 'pull_request' && 'code-change' || 'batch' }}
          FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '300' || '1800' }}
          GITHUB_TOKEN: ${{ github.token }}
