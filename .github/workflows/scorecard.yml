name: OpenSSF Scorecard

# Publishes this repository's supply-chain score to the public Scorecard API (the README badge reads
# it) and its findings to the Security tab. publish_results restricts what this workflow may contain:
# no top-level env or defaults, and only checkout, scorecard-action, upload-artifact and upload-sarif.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 2" # weekly
  branch_protection_rule: {}
  workflow_dispatch: {}

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish_results signs the results with the workflow's OIDC identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: results.sarif
