name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 6 * * 1" # weekly dependency audit

permissions:
  contents: read

jobs:
  lint:
    if: github.event.pull_request.draft != true
    name: Lint (ruff + basedpyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      # The locked dev tools and app requirements, then the project itself (app/ on the path, and the dev
      # commands): basedpyright resolves imports against them.
      - run: pip install --require-hashes -r requirements-dev.txt && pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: basedpyright
      - name: Import boundaries (import-linter)
        run: lint-imports

  test:
    if: github.event.pull_request.draft != true
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install --require-hashes -r requirements-dev.txt && pip install --no-deps -e .
      # pyproject.toml keeps coverage's data file in local/, which isn't in the checkout.
      - run: mkdir -p local
      - run: python -m pytest -q --cov --cov-report=term --cov-fail-under=90
      # The README's coverage badge is published by .github/workflows/pages.yml instead of here —
      # it re-runs coverage and serves coverage.json from the project's GitHub Pages site, so
      # publishing it doesn't need a `contents: write` grant or a dedicated orphan branch in CI.

  audit:
    if: github.event.pull_request.draft != true
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r requirements-dev.txt
      # Both locks are fully pinned and hashed, so pip-audit checks exactly those versions without resolving.
      - run: pip-audit --disable-pip --require-hashes -r app/requirements.txt -r requirements-dev.txt --strict

  shell:
    if: github.event.pull_request.draft != true
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # shellcheck is preinstalled on GitHub's ubuntu runners; shfmt comes from the pinned dev requirements
      # and reads its style from .editorconfig.
      - run: shellcheck -S warning ./scripts/*.sh ./scripts/ci/*.sh app/entrypoint.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: ./scripts/ci/pip-install-locked.sh requirements-dev.txt shfmt-py
      - run: shfmt -d scripts/ app/entrypoint.sh

  docs:
    if: github.event.pull_request.draft != true
    name: Docs (markdownlint + prettier + links + typos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Both read their settings from .markdownlint.yaml and .prettierrc.yaml; versions pinned here.
      - run: git ls-files -z '*.md' | xargs -0 npx --yes markdownlint-cli2@0.23.2
      - run: git ls-files -z '*.md' | xargs -0 npx --yes prettier@3.9.6 --check
      # Relative links and #fragments only, so a flaky external site can't fail a pull request;
      # .github/workflows/links.yml checks external links weekly.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress './**/*.md'
          fail: true
      # Spelling over everything git tracks, configured in pyproject.toml's [tool.typos].
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: ./scripts/ci/pip-install-locked.sh requirements-dev.txt typos
      - run: typos

  docker:
    if: github.event.pull_request.draft != true
    name: Docker (hadolint + build + compose config)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the image scan to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: app
          push: false
          load: true
          tags: instadroid-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image smoke test
        run: ./scripts/ci/smoke-test.sh instadroid-app:ci
      # Report-only for now: the base image's Debian packages and the apkeep binary aren't covered by
      # pip-audit. Findings land in the Security tab (not for fork PRs, whose token can't upload).
      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: instadroid-app:ci
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile freshrss config -q

  dependency-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      # Fails a pull request that adds a dependency with a known vulnerability of high severity or worse.
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  secrets:
    if: github.event.pull_request.draft != true
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits via the API when scanning a PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  actionlint:
    if: github.event.pull_request.draft != true
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # A pinned release, checked against its published checksum before it runs.
      - run: |
          curl -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  zizmor:
    if: github.event.pull_request.draft != true
    name: Workflow security lint (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: ./scripts/ci/pip-install-locked.sh requirements-dev.txt zizmor
      - run: zizmor --min-severity=medium .github/workflows
        env:
          # Lets zizmor run its online audits (e.g. checking action pins against the real repo)
          # instead of falling back to offline-only checks.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
