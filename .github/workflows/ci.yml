name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly dependency audit

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r scripts/requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [driver, feed]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r ${{ matrix.component }}/requirements.txt -r scripts/requirements-dev.txt
      - run: python -m pytest ${{ matrix.component }}/tests -q
        env:
          PYTHONPATH: ${{ matrix.component }}

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [driver, feed]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r scripts/requirements-dev.txt
      - run: pip-audit -r ${{ matrix.component }}/requirements.txt --strict

  shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - run: shellcheck -S warning ./scripts/*.sh

  docker:
    name: Docker (hadolint + build + compose config)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [driver, feed]
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ matrix.component }}/Dockerfile
          failure-threshold: warning
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          push: false
          load: true
          tags: instadroid-${{ matrix.component }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image smoke test
        run: |
          if [ "${{ matrix.component }}" = feed ]; then
            docker run --rm -d --name feed -p 8000:8000 instadroid-feed:ci
            for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
            curl -fs localhost:8000/health | grep -q '"ok":true'
            docker rm -f feed
          else
            docker run --rm instadroid-driver:ci python -c "import scraper; print('import ok')"
          fi
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile redroid config -q

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits via the API when scanning a PR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
