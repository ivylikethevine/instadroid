name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly dependency audit

permissions:
  contents: read

jobs:
  lint:
    if: github.event.pull_request.draft != true
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r scripts/requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    if: github.event.pull_request.draft != true
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r app/requirements.txt -r scripts/requirements-dev.txt
      - run: python -m pytest app/tests -q
        env:
          PYTHONPATH: app

  audit:
    if: github.event.pull_request.draft != true
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r scripts/requirements-dev.txt
      - run: pip-audit -r app/requirements.txt --strict

  shell:
    if: github.event.pull_request.draft != true
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - run: shellcheck -S warning ./scripts/*.sh

  docker:
    if: github.event.pull_request.draft != true
    name: Docker (hadolint + build + compose config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: app
          push: false
          load: true
          tags: instadroid-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image smoke test
        run: |
          docker run --rm instadroid-app:ci python -c "import scraper; print('import ok')"
          # network=host: the feed binds 127.0.0.1 by default, same as the compose service.
          docker run --rm -d --name app --network host instadroid-app:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs localhost:8000/health | grep -q '"ok":true'
          docker rm -f app
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config -q

  secrets:
    if: github.event.pull_request.draft != true
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits via the API when scanning a PR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
