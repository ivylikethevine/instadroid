name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 6 * * 1" # weekly dependency audit

permissions:
  contents: read

jobs:
  lint:
    if: github.event.pull_request.draft != true
    name: Lint (ruff + pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      # The app's own requirements too: pyright resolves imports against them.
      - run: pip install -r app/requirements.txt -r scripts/requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright

  test:
    if: github.event.pull_request.draft != true
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r app/requirements.txt -r scripts/requirements-dev.txt
      # pyproject.toml keeps coverage's data file in local/, which isn't in the checkout.
      - run: mkdir -p local
      - run: python -m pytest -q --cov=app --cov-report=term
      # The README's coverage badge is published by .github/workflows/pages.yml instead of here —
      # it re-runs coverage and serves coverage.json from the project's GitHub Pages site, so
      # publishing it doesn't need a `contents: write` grant or a dedicated orphan branch in CI.

  audit:
    if: github.event.pull_request.draft != true
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: pip install -r scripts/requirements-dev.txt
      - run: pip-audit -r app/requirements.txt --strict

  shell:
    if: github.event.pull_request.draft != true
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # shellcheck is preinstalled on GitHub's ubuntu runners.
      - run: shellcheck -S warning ./scripts/*.sh

  docker:
    if: github.event.pull_request.draft != true
    name: Docker (hadolint + build + compose config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: app
          push: false
          load: true
          tags: instadroid-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image smoke test
        run: ./scripts/smoke-test.sh instadroid-app:ci
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose --profile freshrss config -q

  secrets:
    if: github.event.pull_request.draft != true
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits via the API when scanning a PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  actionlint:
    if: github.event.pull_request.draft != true
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  zizmor:
    if: github.event.pull_request.draft != true
    name: Workflow security lint (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: pip install zizmor
      - run: zizmor --min-severity=medium .github/workflows
        env:
          # Lets zizmor run its online audits (e.g. checking action pins against the real repo)
          # instead of falling back to offline-only checks.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
