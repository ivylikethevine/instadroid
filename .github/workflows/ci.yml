name: CI

# The blocking checks. Every job that has a local equivalent runs it through scripts/check.sh, the same
# command a contributor runs, so the two can't drift; the job only installs the tools first.
#
# Required checks (branch protection): CI result. It's a roll-up over every job below, so it keeps one
# stable name while jobs are renamed, added, or skipped by the change filter; a skipped job counts as
# passed, a failed or cancelled one fails it. The individual job names are informational.
#
# `changes` skips the Python and Docker jobs when a push or pull request touches only Markdown,
# docs/, or workflow files. `Quick lint` always runs, and the schedule and a manual dispatch always run
# everything. It also finds a push whose tree a green same-repository pull request run already took
# (the usual squash merge): that run recorded the tree (`CI result`), the push finds the record, and
# every other job skips. The push run still concludes success, which is all publish.yml's gate asks.
on:
  push:
    branches: [main]
  # Drafts run nothing (each job's `if`); ready_for_review isn't a default type, and converted_to_draft
  # starts a run that cancels the draft's in-flight one.
  pull_request:
    branches: [main, dev] # dev: the sync PRs' commits are graded by this PR
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: "17 6 * * 1" # weekly dependency audit
  workflow_dispatch: {}

permissions:
  contents: read

# A newer push to a pull request cancels its in-flight run. Other events group per commit, so a
# quick second push to main can't displace a queued run: publish.yml's gate needs a green run on
# the exact tagged commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event.pull_request.draft != true
    name: Changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the paths filter lists a pull request's files through the API
      actions: read # find_tree_run.sh reads other runs and their artifacts
      checks: write # the mirrored check runs of a reused run
    # A schedule or dispatch has no diff to filter (the filter step is skipped), so it counts as a change
    # to everything, and a reused run as a change to nothing.
    outputs:
      code: ${{ steps.gate.outputs.code }}
      deps: ${{ steps.gate.outputs.deps }}
      reuse-run: ${{ steps.reuse.outputs.run }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # some-with-excludes: a file counts when it matches `**` and none of the negated patterns. Plain
      # `some` would count a Markdown file too, since `**` matches it.
      - if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.github/workflows/**'
            deps:
              - 'app/requirements.*'
              - 'requirements-dev.*'
              - 'pyproject.toml'
      # continue-on-error: a failed lookup is a full run, never a skipped one
      - id: reuse
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ github.event.head_commit.tree_id }}
        run: .github/scripts/find_tree_run.sh ci.yml "ci-tree-$TREE" | tee -a "$GITHUB_OUTPUT"
      - id: gate
        env:
          FILTERED: ${{ steps.filter.outcome == 'success' }}
          CODE: ${{ steps.filter.outputs.code }}
          DEPS: ${{ steps.filter.outputs.deps }}
          REUSE_RUN: ${{ steps.reuse.outputs.run }}
        run: |
          set -eu
          if [ -n "$REUSE_RUN" ]; then
            CODE=false DEPS=false
          elif [ "$FILTERED" != true ]; then
            CODE=true DEPS=true
          fi
          printf 'code=%s\ndeps=%s\n' "$CODE" "$DEPS" >>"$GITHUB_OUTPUT"
      # What a reused run hands the pushed commit: one completed check run per job that passed there,
      # linking back to it.
      - name: Mirror the pull request run's checks onto this commit
        if: steps.reuse.outputs.run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.reuse.outputs.run }}
        run: |
          set -euo pipefail
          echo "Reusing pull request run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN - this commit's tree is the one it tested." >>"$GITHUB_STEP_SUMMARY"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "success") | [.name, .html_url] | @tsv' |
            while IFS=$'\t' read -r name url; do
              gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" \
                -f name="$name" -f head_sha="$GITHUB_SHA" -f status=completed \
                -f conclusion=success -f details_url="$url" \
                -f "output[title]=Reused from pull request run $RUN" \
                -f "output[summary]=This commit's tree is the one that run tested." >/dev/null
              printf 'success  %s\n' "$name"
            done

  # Every check that compiles and installs nothing, one job, one runner. Each runs even when an earlier
  # one failed, so one push shows every finding; the jobs below wait on this one, so a stray blank line
  # costs seconds and not a build. Not gated on `code`, whose filter ignores most of what these read.
  quick-lint:
    needs: changes
    if: needs.changes.outputs.reuse-run == ''
    name: Quick lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits via the API when scanning a PR
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # From tools.txt (sha256-verified): lychee, zizmor, actionlint and the pinned shellcheck it runs over
      # `run:` blocks. .shellcheckrc lets shellcheck follow `source` lines.
      - uses: ./.github/actions/setup-tools
        with:
          tools: shellcheck actionlint zizmor lychee
      # check.sh runs `npm ci` in .github: markdownlint-cli2 and prettier, with their whole dependency
      # tree, from .github/package-lock.json. Both read .markdownlint.yaml and .prettierrc.yaml.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .github/package-lock.json
      # typos (.typos.toml) and shfmt, which reads its style from .editorconfig, from the pinned dev
      # requirements; the same Python runs the docs drift check.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: ./.github/scripts/pip-install-locked.sh requirements-dev.txt typos shfmt-py
      # check.sh runs every check whatever the earlier ones did, and under CI a missing tool fails it.
      # docs: lychee (lychee.toml) on relative links and #fragments only, so a flaky external site can't
      # fail a pull request; link-check.yml checks external links after merge and weekly. lint-workflows:
      # yq and jq are on the runner.
      - if: ${{ !cancelled() }}
        run: scripts/check.sh shell docs actionlint lint-workflows
      - if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # workflows, composite actions and dependabot.yml
      - if: ${{ !cancelled() }}
        run: scripts/check.sh zizmor
        env:
          # Lets zizmor run its online audits (e.g. checking action pins against the real repo)
          # instead of falling back to offline-only checks.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Lint: ruff check + format, basedpyright, and import-linter's boundaries. Unit tests: the floor is
  # pyproject.toml's [tool.coverage.report] fail_under, which pytest-cov enforces; its figures and HTML report
  # are artifacts, which coverage.yml hands to pages.yml for the README's badges.
  python:
    needs: [changes, quick-lint]
    if: needs.changes.outputs.code == 'true'
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { check: python, name: "Lint (ruff + basedpyright)", timeout: 5 }
          - { check: test, name: "Unit tests", timeout: 10 }
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      # The locked dev tools and app requirements, then the project itself (app/ on the path, and the dev
      # commands): basedpyright resolves imports against them. --no-build-isolation builds it with the
      # locked setuptools instead of fetching an unhashed one.
      - run: pip install --require-hashes -r app/requirements.txt -r requirements-dev.txt && pip install --no-build-isolation --no-deps -e .
      - if: matrix.check == 'python'
        run: scripts/check.sh python
      - if: matrix.check == 'test'
        uses: ./.github/actions/measure-coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.check == 'test' && !cancelled() && hashFiles('coverage-badge/coverage.json') != '' }}
        with:
          name: coverage-badge
          path: coverage-badge
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.check == 'test' && !cancelled() && hashFiles('coverage-html/index.html') != '' }}
        with:
          name: coverage-html
          path: coverage-html
          retention-days: 90

  # A change to a lock or to what they compile from; advisories.yml reports a new advisory against a tree
  # nobody touched. The schedule runs it regardless.
  audit:
    needs: [changes, quick-lint]
    if: needs.changes.outputs.deps == 'true'
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      # pip-audit and its dependencies only: with --disable-pip it reads the locks instead of installing them.
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: scripts/check.sh audit

  docker:
    needs: [changes, quick-lint]
    if: needs.changes.outputs.code == 'true'
    name: Docker (hadolint + build + compose config)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the image scan to code scanning
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # hadolint and trivy from tools.txt (sha256-verified); hadolint reads .hadolint.yaml.
      - uses: ./.github/actions/setup-tools
        with:
          tools: hadolint trivy
      # hadolint, advisory: a finding is a warning and a step summary, never a failed job. Then `docker
      # compose config`, with and without the freshrss profile, interpolated from .env.example.
      - id: hadolint
        run: scripts/check.sh docker
      - if: steps.hadolint.outputs.hadolint-findings == 'true'
        uses: ./.github/actions/advisory-note
        with:
          title: hadolint
          warning-body: hadolint has findings in app/Dockerfile - advisory, not blocking
          heading: hadolint findings in app/Dockerfile
          body: Advisory only, never blocks a merge. Reproduce with `scripts/check.sh hadolint`.
          report-file: ${{ runner.temp }}/check-hadolint.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          push: false
          load: true
          tags: instadroid-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image smoke test
        run: ./.github/scripts/smoke-test.sh instadroid-app:ci
      # Advisory, as is publish.yml's `scan` job. This one shows what a pull request's image carries (the
      # base image's Debian packages and the apkeep binary, which pip-audit doesn't cover), in the step
      # summary and, from the SARIF, the Security tab (not for fork PRs, whose token can't upload). trivy
      # reads the root .trivyignore.
      - name: Scan the image (Trivy, advisory)
        id: trivy
        run: .github/scripts/trivy_scan.sh instadroid-app:ci "$RUNNER_TEMP"
      - if: steps.trivy.outputs.found == '0'
        run: printf '### Trivy image scan\n\nNo fixable HIGH or CRITICAL findings in the built image.\n' >>"$GITHUB_STEP_SUMMARY"
      - if: steps.trivy.outputs.found != '0'
        uses: ./.github/actions/advisory-note
        with:
          title: trivy
          warning-body: Trivy found fixable HIGH/CRITICAL vulnerabilities in the built image - advisory, never blocking
          heading: Trivy image scan
          body: Fixable HIGH and CRITICAL findings in the built app image. Advisory here and in publish.yml's scan.
          report-file: ${{ runner.temp }}/trivy.txt
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          category: trivy-image

  dependency-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    name: Dependency review
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      # Fails a pull request that adds a dependency with a known vulnerability of high severity or worse.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # The required check (see the header). always(), so it reports even when a job it needs failed or
  # was skipped; it fails only on a failure or cancellation.
  result:
    # skipped on a draft like the jobs it needs; a skipped required check still passes
    if: always() && github.event.pull_request.draft != true
    needs: [changes, quick-lint, python, audit, docker, dependency-review]
    name: CI result
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*)
              echo "::error::a CI job failed or was cancelled"
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/mark-tree
          sparse-checkout-cone-mode: false
      # The tree a same-repository run tested, recorded only when the heavy jobs ran: a docs-only diff
      # against `dev` skips them and still goes green, and that must not vouch for a push whose diff is
      # code. The audit and dependency review skip by design, so they don't count. find_tree_run.sh's
      # header says why a fork's run never counts.
      - if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          needs.python.result == 'success' && needs.docker.result == 'success'
        uses: ./.github/actions/mark-tree
        with:
          prefix: ci-tree
