blank_issues_enabled: true
contact_links:
  - name: Report a vulnerability
    url: https://github.com/ivylikethevine/instadroid/security/advisories/new
    about: >-
      Anything exploitable goes here privately, never in a public issue.
  - name: Security policy
    url: https://github.com/ivylikethevine/instadroid/blob/main/docs/SECURITY.md
    about: >-
      What's in scope, what's out of scope, and how reports are handled -
      worth reading before deciding something is a bug.
  - name: Getting help
    url: https://github.com/ivylikethevine/instadroid/blob/main/docs/SUPPORT.md
    about: >-
      Where to ask, what to include (`scraper.py doctor` output), and what to expect
      from a one-maintainer project.
