# Names what dependabot could move: the SHA-pinned `uses:` in the workflows
# and composite actions, the Markdown tools' npm lock, the hashed pip locks,
# and the digest-pinned images.
#
# What this file cannot cover, and what covers it instead:
#
#   * The CI tools in .github/actions/setup-tool/tools.txt and the inline pins
#     in .github/scripts/check_tool_versions.local.sh (apkeep's ADD URL, the
#     just-the-docs theme): tool-versions.yml reports their drift in the same
#     tracking issue, with the same 7-day cooldown. It also checks the Python
#     version agrees across pyproject.toml, app/Dockerfile and every
#     setup-python, and that x-redroid-image matches the redroid service's
#     pinned image.
#   * Whether an image bump fixes anything: the docker ecosystems are
#     version-updates-only (GHSA has no container ecosystem), and a digest is
#     just a digest. image-scan.yml measures that with trivy.
#   * The language lines (setup-python's python-version, setup-node's
#     node-version): moved by hand.
#
# Renovate was weighed and declined: it would cover the pins this file cannot,
# but costs a second bot, its own config dialect, and a PR stream where
# tool-versions.yml keeps one tracking issue.
#
# Each entry sets `open-pull-requests-limit: 0`, so no version-update pull
# request opens: tool-versions.yml reports the same drift in one tracking
# issue, and every bump is a hand edit made from it. Deleting the limits turns
# the pull requests back on, with the schedule, cooldown and ignores they
# need. Dependabot security updates, if enabled in the repository settings,
# are not bound by the limit and still open their own pull requests.
version: 2

updates:
  # the composite actions under .github/actions/ pin their own `uses:`
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    commit-message:
      prefix: deps
    open-pull-requests-limit: 0
    # let a release age before its bump: a compromised release's window is its
    # first days (zizmor: dependabot-cooldown)
    cooldown:
      default-days: 7

  # .github/package.json -> package-lock.json (markdownlint-cli2, prettier)
  - package-ecosystem: npm
    directory: /.github
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    commit-message:
      prefix: deps
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7

  # app/requirements.in -> the hashed app/requirements.txt the image installs
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    commit-message:
      prefix: deps
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7

  # requirements-dev.in -> the hashed requirements-dev.txt (ruff, basedpyright, ...)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    commit-message:
      prefix: deps
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7

  # app/Dockerfile's digest-pinned python base image
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    commit-message:
      prefix: deps
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7

  # docker-compose.yml's digest-pinned redroid and freshrss images
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: dev
    commit-message:
      prefix: deps
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    ignore:
      # A new Android major needs its own /data volume and validation
      # (CLAUDE.md): a migration, not an update. A digest refresh is still one.
      - dependency-name: erstt/redroid
        update-types: ["version-update:semver-major"]
